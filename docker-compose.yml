services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${SITE_URL}/auth
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Variables substituées dans le realm importé (aucun secret dans le dépôt).
      KC_REDIRECT_URI: ${SITE_URL}/*
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD}
      KC_TEST_USER_TOTP_SECRET: ${KC_TEST_USER_TOTP_SECRET}
    volumes:
      - ./deploy/keycloak/xeleron-realm.json:/opt/keycloak/data/import/xeleron-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-xeleronia-backend:local}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://xeleron_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PURGE_DB_PASSWORD: ${PURGE_DB_PASSWORD}
      LOG_DIR: /var/log/xeleron
      STORAGE_DIR: /srv/storage
      MAX_UPLOAD_BYTES: 52428800
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss-20b}
      OIDC_ISSUER: ${SITE_URL}/auth/realms/xeleron
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/xeleron/protocol/openid-connect/certs
      OIDC_CLIENT_ID: xeleron-web
      OIDC_REQUIRED_ACR: "2"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - storage:/srv/storage
      - logs:/var/log/xeleron
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${WEB_IMAGE:-xeleronia-web:local}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-53477376}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
    restart: unless-stopped

  # Profil local uniquement : absent du déploiement hébergé (démo = Gemini).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

# Chiffrement au repos : ces volumes résident sur un volume de l'hôte chiffré (ADR 0003).
volumes:
  pgdata:
  storage:
  logs:
  caddy_data:
  ollama:
