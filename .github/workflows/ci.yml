name: ci

on:
  push:
    branches: [main]
    tags: ["jalon-*", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Droits réels de la base (F-21) : le test échoue en CI s'il est absent.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: ruff
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run mypy
      - name: pytest
        working-directory: backend
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run lint && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: bandit
        working-directory: backend
        run: uv sync --frozen && uv run bandit -q -r app -c pyproject.toml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (dépendances et configuration)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  ocr:
    # Docling réel sur CPU : extraction d'un scan dégradé et d'un PDF sans couche texte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Tests Docling
        working-directory: backend
        env:
          RUN_DOCLING_TESTS: "1"
        run: |
          uv sync --frozen --extra ocr
          set +e
          uv run pytest tests/test_docling_integration.py -q -s -p no:cacheprovider > ocr.log 2>&1
          code=$?
          tail -n 40 ocr.log
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E '^E |Error|FAILED|passed|failed|mesure' ocr.log | tail -15 | sed ':a;N;$!ba;s/
/%0A/g')
            echo "::error title=Tests Docling::${summary}"
          fi
          exit "$code"

  smoke:
    # N-15 : démarrage reproductible par conteneur (pile complète, sonde /health via Caddy).
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 420
      - name: Sonde de santé via Caddy
        run: curl -fsSk --retry 5 --retry-delay 3 https://localhost/api/health
      - name: Keycloak (realm importé, émetteur attendu)
        run: |
          curl -fsSk https://localhost/auth/realms/xeleron/.well-known/openid-configuration             | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['issuer']=='https://localhost/auth/realms/xeleron', d['issuer']"
      - name: Une route protégée sans session répond 401
        run: test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/me)" = "401"
      - uses: astral-sh/setup-uv@v5
      - name: F-01 de bout en bout (mot de passe + TOTP réels, puis mono-facteur refusé)
        working-directory: backend
        env:
          KC_TEST_USER_PASSWORD: change-me-test-user
          KC_TEST_USER_TOTP_SECRET: ChangeMeTotpSecret01
        run: uv sync --frozen && uv run python -I ../scripts/mfa_login_check.py
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color backend web db | tail -n 100
      - run: docker compose down -v

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security, ocr, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: trivy (images)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-backend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-dev:
    # Activé quand l'hôte DEV existe : variable de dépôt DEV_DEPLOY_ENABLED=true (P13, voir PROGRESS.md).
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Déploiement DEV par SSH
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          if [ -z "$DEV_HOST" ] || [ -z "$DEV_SSH_KEY" ]; then
            echo "::error::Secrets DEV_HOST, DEV_USER et DEV_SSH_KEY requis (voir README, section Déploiement)."
            exit 1
          fi
          install -m 600 /dev/null key && printf '%s\n' "$DEV_SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml "$DEV_USER@$DEV_HOST:~/xeleronia/docker-compose.yml"
          ssh -i key "$DEV_USER@$DEV_HOST" "cd ~/xeleronia && export BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xeleronia-backend:$IMAGE_TAG WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xeleronia-web:$IMAGE_TAG && docker compose pull && docker compose up -d --remove-orphans"
          rm -f key
