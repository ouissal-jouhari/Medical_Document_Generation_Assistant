name: ci

on:
  push:
    branches: [main]
    tags: ["jalon-*", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: ruff
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run mypy
      - name: pytest
        working-directory: backend
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run lint && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: bandit
        working-directory: backend
        run: uv sync --frozen && uv run bandit -q -r app -c pyproject.toml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (dépendances et configuration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: trivy (images)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/xeleronia-backend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-dev:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Déploiement DEV par SSH
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          if [ -z "$DEV_HOST" ] || [ -z "$DEV_SSH_KEY" ]; then
            echo "::error::Secrets DEV_HOST, DEV_USER et DEV_SSH_KEY requis (voir README, section Déploiement)."
            exit 1
          fi
          install -m 600 /dev/null key && printf '%s\n' "$DEV_SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml "$DEV_USER@$DEV_HOST:~/xeleronia/docker-compose.yml"
          ssh -i key "$DEV_USER@$DEV_HOST" "cd ~/xeleronia && export BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xeleronia-backend:$IMAGE_TAG WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xeleronia-web:$IMAGE_TAG && docker compose pull && docker compose up -d --remove-orphans"
          rm -f key
