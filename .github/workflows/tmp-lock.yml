name: tmp-lock

on:
  push:
    branches: [jalon-6-export-provenance]
    paths: [backend/pyproject.toml, .github/workflows/tmp-lock.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - name: uv lock
        working-directory: backend
        run: uv lock
      - name: commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git diff --cached --quiet || git commit -m "build: lock jinja2 and weasyprint"
          git push
