id: discharge_summary
title: Discharge Summary
sections:
  - name: Admission details
    level: STANDARD
    description: Date, reason and diagnosis at admission.
  - name: Discharge details
    level: STANDARD
    description: Date of discharge, destination and condition at discharge.
  - name: Clinical summary
    level: REQUIRED
    description: Hospital course, from admission to discharge.
  - name: Investigation results
    level: STANDARD
    description: Laboratory, imaging and other investigation results.
  - name: Medications at discharge
    level: SAFETY
    description: Medications and doses at discharge, explicitly stated in the text.
  - name: Allergies and adverse reactions
    level: SAFETY
    description: Allergies or adverse reactions explicitly stated in the text.
  - name: Plan and requested actions
    level: STANDARD
    description: Follow-up plan and actions requested.
  - name: Information and advice given
    level: STANDARD
    description: Instructions and advice given to the patient.
