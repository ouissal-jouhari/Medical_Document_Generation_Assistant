[project]
name = "xeleronia-backend"
version = "0.1.0"
description = "XeleronIA – backend (monolithe modulaire)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pillow>=10.4",
    "jinja2>=3.1",
    "weasyprint>=62",
]

[project.optional-dependencies]
# Extraction OCR locale (Docling sur CPU). Installé dans l'image Docker et dans le job CI dédié.
ocr = ["docling>=2.0", "torch", "torchvision"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-pyyaml",
    "fpdf2>=2.8",
]

# PyTorch CPU seulement (pas de CUDA : image plus légère, poste sans GPU).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["docling.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.tmp-tests"

[tool.bandit]
exclude_dirs = ["tests"]
